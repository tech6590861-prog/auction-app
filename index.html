<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Live Auction</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="screen">

  <div class="topbar">
    <span class="mark">Auction</span>
    <span id="status-pill" class="status-pill">—</span>
  </div>

  <!-- =========================== NOT FOUND =========================== -->
  <div class="step hidden" id="step-notfound" data-step="notfound">
    <div class="center-flow">
      <p class="step-title">Auction not found</p>
      <p class="text-muted">This link may have expired or been removed. Check the link and try again.</p>
    </div>
  </div>

  <!-- =============================== ITEM ============================= -->
  <!-- Item + price + history are always rendered once the auction loads;
       the flow below (identify/verify/bid) sits under it. -->
  <div id="item-block">
    <img id="item-photo" class="item-photo" alt="" />
    <h1 id="item-title" class="item-title"></h1>
    <p id="item-desc" class="item-desc"></p>
    <div id="countdown" class="countdown"></div>

    <div class="price-block">
      <div id="price-label" class="price-label"></div>
      <div id="price-value" class="price-value"></div>
      <div id="min-next" class="min-next"></div>
    </div>

    <div class="bid-history">
      <h3>Bid history</h3>
      <div id="bid-list"></div>
    </div>
  </div>

  <!-- ============================ IDENTIFY ============================ -->
  <div class="step hidden" id="step-identify" data-step="identify">
    <p class="step-eyebrow">Step 1 of 2</p>
    <p class="step-title">Enter your details to bid</p>
    <div id="identify-error" class="error-box hidden"></div>
    <form id="identify-form">
      <div class="field">
        <label for="name-input">Full name</label>
        <input id="name-input" type="text" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="phone-input">WhatsApp number</label>
        <div class="phone-input-row">
          <select id="phone-country" aria-label="Country code"></select>
          <input id="phone-input" type="tel" inputmode="tel" placeholder="555 123 4567" autocomplete="tel-national" required />
        </div>
        <div class="hint">We'll send a one-time code to this number on WhatsApp.</div>
      </div>
      <div class="field">
        <label for="email-input">Email (optional)</label>
        <input id="email-input" type="email" autocomplete="email" />
      </div>
      <button id="identify-submit" data-label="Send verification code" class="btn-primary" type="submit">Send verification code</button>
    </form>
  </div>

  <!-- ============================== VERIFY ============================= -->
  <div class="step hidden" id="step-verify" data-step="verify">
    <p class="step-eyebrow">Step 2 of 2</p>
    <p class="step-title">Enter the code we sent you</p>
    <p class="text-muted" style="margin-top:-12px;margin-bottom:16px;">
      Sent via WhatsApp to <span id="verify-phone-label"></span>
    </p>
    <div id="test-mode-note" class="error-box hidden" style="color:var(--gold-bright);background:rgba(207,163,59,0.1);border-color:rgba(207,163,59,0.35);"></div>
    <div id="verify-error" class="error-box hidden"></div>
    <form id="verify-form">
      <div class="field">
        <label for="code-input">6-digit code</label>
        <input id="code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required />
      </div>
      <button id="verify-submit" data-label="Verify and continue" class="btn-primary" type="submit">Verify and continue</button>
    </form>
    <button id="resend-code" class="btn-text" type="button">Resend code</button>
    <button id="back-to-identify" class="btn-text" type="button">Use a different number</button>
  </div>

  <!-- =============================== BID =============================== -->
  <div class="step hidden" id="step-bid" data-step="bid">
    <p id="bidder-greeting" class="text-muted" style="margin-top:18px;"></p>
    <div id="my-status" class="my-status hidden"></div>
  </div>

</div>

<div id="bid-bar" class="bid-bar hidden">
  <div id="bid-error" class="error-box hidden" style="max-width:480px;margin:0 auto 10px;"></div>
  <form id="bid-form" class="bid-bar-inner">
    <input id="bid-amount-input" type="number" step="0.01" inputmode="decimal" placeholder="Bid amount" />
    <button id="bid-submit" data-label="Place bid" class="btn-primary" type="submit">Place bid</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/bidder.js"></script>
</body>
</html>
